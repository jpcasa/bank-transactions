services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.167
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init/01-create-db.sql:/docker-entrypoint-initdb.d/zz-01-create-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/transactions
      PORT: "8787"
      CORS_ORIGIN: http://localhost:8080
      SEED: ${SEED:-true}
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8787
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
