# Render Blueprint: Dashboard → New → Blueprint → pick this repo/branch.
# DATABASE_URL is prompted on creation (sync: false) — use the Supabase pooler URL.
services:
  - type: web
    name: bank-transactions-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: SEED
        value: "true"

  - type: web
    name: bank-transactions-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://bank-transactions-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
